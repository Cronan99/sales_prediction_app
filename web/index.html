<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page-shell">
        <header class="page-header">
            <div class="heading-group">
                <p class="eyebrow">FISHMONGER / DAILY FORECAST</p>
                <h1>Sales predictions</h1>
            </div>
            <div class="date-control">
                <label for="date">Forecast date</label>
                <input id="date" type="date">
            </div>
        </header>

        <section aria-label="Article sales predictions">
            <div class="list-heading" aria-hidden="true">
                <span>Article</span>
                <span>Price per unit</span>
                <span>Predicted sales</span>
            </div>
            <div id="product-list" class="product-list"></div>
        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
